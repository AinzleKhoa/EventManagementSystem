  voucherapi:
    build:
      context: .
      dockerfile: VoucherAPI/Dockerfile
    container_name: voucherapi
    depends_on:
      - sqlserver
    environment:
      <<: *common-variables
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=VoucherDB;User Id=sa;Password=123456;TrustServerCertificate=True;"
    ports:
      - "5009:5000"
    volumes:
      - ./https:/https
    networks:
      - app-network

  withdrawalapi:
    build:
      context: .
      dockerfile: WithdrawalAPI/Dockerfile
    container_name: withdrawalapi
    depends_on:
      - sqlserver
    environment:
      <<: *common-variables
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=WithdrawalDB;User Id=sa;Password=123456;TrustServerCertificate=True;"
    ports:
      - "5010:5000"
    volumes:
      - ./https:/https
    networks:
      - app-network

  gatewayapi:
    build:
      context: .
      dockerfile: GatewayAPI/Dockerfile
    container_name: gatewayapi
    depends_on:
      - authenticationapi
      - bookingapi
      - categoryapi
      - chatapi
      - chatbotapi
      - eventapi
      - notificationapi
      - socialapi
      - voucherapi
      - withdrawalapi
    environment:
      ASPNETCORE_URLS: "https://+:8080"
      ASPNETCORE_Kestrel__Certificates__Default__Password: "123456"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/aspnetapp.pfx"
    ports:
      - "8080:8080"
    volumes:
      - ./https:/https
    networks:
      - app-network

  webclient:
    build:
      context: .
      dockerfile: WebClient/Dockerfile
    container_name: webclient
    depends_on:
      - gatewayapi
    environment:
      ASPNETCORE_URLS: "https://+:7000"
      ASPNETCORE_Kestrel__Certificates__Default__Password: "123456"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/aspnetapp.pfx"
      Gateway__BaseUrl: "https://gatewayapi:8080"
    ports:
      - "7000:7000"
    volumes:
      - ./https:/https
    networks:
      - app-network

volumes:
  sql-data:

networks:
  app-network:
    driver: bridge